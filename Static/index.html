<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Piano Pitch Detector</title>
<style>
  :root{
    --bg:#0b0d10; --card:#15191f; --card2:#1b212a; --line:#2a313c;
    --txt:#e8edf3; --dim:#8b97a6; --accent:#7c6cff; --accent2:#9d90ff;
    --flat:#4aa3ff; --sharp:#ff7a59; --ok:#37c98b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:0 18px 60px;}
  header{padding:26px 0 14px; border-bottom:1px solid var(--line); margin-bottom:20px;}
  h1{font-size:26px; margin:0 0 4px; font-weight:700;}
  .sub{color:var(--dim); font-size:15px;}
  .label{font-size:12px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--dim); margin:0 0 8px;}
  .drop{border:2px dashed var(--line); border-radius:16px; padding:30px 16px;
    text-align:center; cursor:pointer; background:var(--card); transition:.15s;}
  .drop:active{background:var(--card2);}
  .drop .note{font-size:34px;}
  .drop .big{font-size:18px; margin-top:8px;}
  .drop .small{color:var(--dim); font-size:13px; margin-top:4px;}
  .filename{background:#16203a; color:#bcd2ff; border-radius:10px;
    padding:12px 14px; margin-top:12px; font-family:ui-monospace,monospace; font-size:14px;
    word-break:break-all;}
  .seg-wrap{margin-top:22px;}
  .seg{display:flex; gap:8px; flex-direction:column;}
  .seg button{flex:1; padding:14px 12px; border-radius:12px; border:1.5px solid var(--line);
    background:var(--card); color:var(--txt); font-size:15px; font-weight:600; cursor:pointer;
    text-align:left; transition:.12s;}
  .seg button .hint{display:block; font-weight:400; font-size:12px; color:var(--dim); margin-top:3px;}
  .seg button.active{border-color:var(--accent); background:#1e1b35; color:#fff;}
  .seg button.active .hint{color:var(--accent2);}
  .field{background:var(--card); border-radius:12px; padding:14px 16px; margin-top:14px;}
  .field input{width:100%; background:transparent; border:none; color:var(--txt);
    font-size:20px; outline:none; margin-top:4px;}
  .analyze{width:100%; margin-top:18px; padding:18px; border:none; border-radius:14px;
    background:var(--accent); color:#fff; font-size:18px; font-weight:700; cursor:pointer;}
  .analyze:disabled{background:#2a2740; color:#6f6a86;}
  .err{background:#2a1614; color:#ff9b86; border-radius:12px; padding:14px 16px; margin-top:16px;}
  .summary{margin-top:22px; background:var(--card2); border-radius:14px; padding:18px;
    border:1px solid var(--line);}
  .summary .head{font-size:20px; font-weight:700; margin:0 0 6px;}
  .summary .meta{color:var(--dim); font-size:14px; line-height:1.5;}
  .warn{color:var(--sharp);}
  .results{margin-top:18px; display:flex; flex-direction:column; gap:10px;}
  .row{background:var(--card); border-radius:12px; padding:14px 16px;}
  .row .top{display:flex; justify-content:space-between; align-items:baseline;}
  .row .nm{font-size:17px; font-weight:700;}
  .row .hz{color:var(--dim); font-size:13px; font-family:ui-monospace,monospace;}
  .row .cents{font-size:16px; font-weight:700;}
  .bar{position:relative; height:8px; background:#0e1217; border-radius:6px; margin-top:10px;
    overflow:hidden;}
  .bar .mid{position:absolute; left:50%; top:0; bottom:0; width:2px; background:#3a4250;}
  .bar .fill{position:absolute; top:0; bottom:0; border-radius:6px;}
  .spinner{display:inline-block; width:18px; height:18px; border:3px solid #ffffff66;
    border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; vertical-align:-3px; margin-right:8px;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<header>
  <h1>Piano Pitch Detector</h1>
  <div class="sub">A0 – A7 · deviation vs stretched tuning</div>
</header>

<p class="label">Recording</p>
<div class="drop" id="drop">
  <div class="note">🎵</div>
  <div class="big">Tap to select audio or video file</div>
  <div class="small">MOV, MP4, MP3, M4A, WAV, AAC, OGG and more</div>
</div>
<input type="file" id="file" accept="audio/*,video/*" style="display:none">
<div id="fileShow"></div>

<div class="seg-wrap">
  <p class="label">Piano size (sets stretch curve)</p>
  <div class="seg" id="seg">
    <button data-preset="spinet">Spinet/Mini Grands
      <span class="hint">most stretch</span></button>
    <button data-preset="average" class="active">Average sized uprights and grands
      <span class="hint">standard stretch</span></button>
    <button data-preset="grand">Long Grand
      <span class="hint">least stretch</span></button>
  </div>
</div>

<div class="field">
  <p class="label" style="margin:0">Min gap between notes (ms)</p>
  <input type="number" id="minGap" value="300">
</div>

<button class="analyze" id="go" disabled>Analyze A0 – A7</button>

<div id="out"></div>

<script>
const drop=document.getElementById('drop');
const fileInput=document.getElementById('file');
const fileShow=document.getElementById('fileShow');
const go=document.getElementById('go');
const out=document.getElementById('out');
const seg=document.getElementById('seg');
let preset='average';
let chosenFile=null;

drop.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',()=>{
  if(fileInput.files.length){
    chosenFile=fileInput.files[0];
    fileShow.innerHTML='<div class="filename">'+chosenFile.name+'</div>';
    go.disabled=false;
  }
});

seg.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  [...seg.children].forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  preset=b.dataset.preset;
});

function centsColor(c){
  if(c===null||c===undefined) return 'var(--dim)';
  if(Math.abs(c)<=5) return 'var(--ok)';
  return c<0 ? 'var(--flat)' : 'var(--sharp)';
}
function fillBar(c){
  // map -50..+50 cents to bar; clamp
  const clamped=Math.max(-50,Math.min(50,c));
  const half=Math.abs(clamped)/50*50; // percent of half-width
  const color=centsColor(c);
  if(c<0){
    return '<div class="fill" style="right:50%;width:'+half+'%;background:'+color+'"></div>';
  } else {
    return '<div class="fill" style="left:50%;width:'+half+'%;background:'+color+'"></div>';
  }
}



go.addEventListener('click', async ()=>{
  if(!chosenFile) return;
  go.disabled=true;
  out.innerHTML='<button class="analyze" disabled><span class="spinner"></span>Analyzing… (first run can take ~1 min)</button>';
  const fd=new FormData();
  fd.append('file',chosenFile);
  fd.append('preset',preset);
  fd.append('minGap',document.getElementById('minGap').value||'300');
  try{
    const r=await fetch('/analyze',{method:'POST',body:fd});
    const data=await r.json();
    if(data.error){ out.innerHTML='<div class="err">'+data.error+'</div>'; go.disabled=false; return; }
    render(data);
  }catch(e){
    out.innerHTML='<div class="err">Network error: '+e.message+'</div>';
  }
  go.disabled=false;
});

function summaryText(avg){
  if(avg===null||avg===undefined) return ["No reading","Couldn't read enough notes \u2014 try a clearer recording"];
  const flat=avg<0, mag=Math.abs(avg);
  const dir = mag<=5 ? "On pitch" : (flat ? "Flat" : "Sharp");
  const tail = "Average " + (avg>0?"+":"") + avg + "\u00A2 vs stretched tuning.";
  return [dir, tail];
}

function render(data){
  const s=data.summary||{};
  const [head,sub]=summaryText(s.avg_cents_from_stretch);
  let html='<div class="summary">';
  html+='<p class="head">'+head+'</p>';
  html+='<div class="meta">'+sub+'<br>';
  html+='Detected '+(s.notes_detected||0)+' of 8 notes';
  if(s.missing_notes && s.missing_notes.length){
    html+=' · <span class="warn">missing: '+s.missing_notes.join(', ')+'</span>';
  }
  if(s.rejected_blobs){ html+=' · '+s.rejected_blobs+' noise blob(s) ignored'; }
  const presetNames={spinet:'Spinet/Mini Grands',average:'Average uprights & grands',grand:'Long Grand'};
  html+='<br>Stretch curve: '+(presetNames[s.preset]||s.preset)+'</div></div>';

  html+='<div class="results">';
  (data.notes||[]).forEach(n=>{
    const c=n.cents_from_stretch;
    const cstr=(c>0?'+':'')+ (c===null?'—':c) + '¢';
    html+='<div class="row"><div class="top">'
      +'<span class="nm">'+n.note_label+'</span>'
      +'<span class="cents" style="color:'+centsColor(c)+'">'+cstr+'</span></div>'
      +'<div class="hz">'+n.freq_measured+' Hz · target '+n.freq_stretched+' Hz</div>'
      +'<div class="bar"><div class="mid"></div>'+fillBar(c||0)+'</div>'
      +'</div>';
  });
  html+='</div>';
  out.innerHTML=html;
}
</script>
</body>
</html>
